kind = "web"
previewPath = "/"
title = "Wild Rift Hub"
version = "1.0.0"
id = "artifacts/wild-rift"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19815

[services.development]
run = "pnpm --filter @workspace/wild-rift run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wild-rift", "run", "build" ]
publicDir = "artifacts/wild-rift/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19815"
BASE_PATH = "/"
